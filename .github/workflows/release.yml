name: release

# Consume pending changesets on every push to main and publish a release.
#
# Flow:
#   1. author work, run `pnpm changeset` to describe the bump, merge to main,
#   2. this workflow, in one run:
#        a. `changeset version` bumps the version, writes the CHANGELOG, and
#           deletes the consumed `.changeset/*.md`,
#        b. runs the same gates ci.yml runs, including the browser suite and
#           the tarball verification,
#        c. `changeset publish` publishes and creates an annotated git tag,
#        d. pushes the version-bump commit and tags back to main,
#        e. re-points the prerelease dist-tag at the current version,
#        f. creates a GitHub Release per new tag from the CHANGELOG entry.
#
# A push with no pending changesets is a no-op.
#
# Publish happens BEFORE the git push, so a failed npm publish leaves main
# untouched and the changesets intact and a re-run republishes cleanly.
#
# Re-run after a publish that succeeded but failed to push: the checkout is
# back at the event SHA, where the changeset is still pending, so `changeset
# version` regenerates the same bump; publish skips (version already on the
# registry); the "Ensure git tags" step recreates the annotated tag that the
# abandoned run never pushed; and the push lands the commit, the tag, and the
# GitHub Release. Tags are matched by exact name, never forced.
#
# Needs an NPM_TOKEN secret with publish rights to `solid-pixi`. Provenance is
# attached over OIDC (`id-token: write` plus NPM_CONFIG_PROVENANCE), which
# requires a public source repo; this one is public. Pushing the bump commit
# uses the default GITHUB_TOKEN, so main must let the actions bot push.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the bump commit and tags, create GitHub Releases
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs full history and tags

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every `.changeset/*.md` except the README is a pending changeset.
      - name: Detect pending changesets
        id: cs
        run: |
          n=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Found $n pending changeset(s)."

      # a. Bump the version, write the CHANGELOG, consume the changesets.
      - name: Version
        if: steps.cs.outputs.count != '0'
        run: pnpm changeset version

      # b. Gate the release on what CI gates on.
      - name: Check (fmt + lint + typecheck)
        if: steps.cs.outputs.count != '0'
        run: pnpm vp check

      - name: Test (node)
        if: steps.cs.outputs.count != '0'
        run: pnpm vp run --filter './packages/tests' test

      - name: Install Chromium
        if: steps.cs.outputs.count != '0'
        run: pnpm --filter tests exec playwright install --with-deps chromium

      - name: Test (browser)
        if: steps.cs.outputs.count != '0'
        run: pnpm --filter tests run test:browser

      # The last gate before an irreversible publish: pack the tarball, lint it
      # with publint and arethetypeswrong, install it into a scratch consumer
      # outside the workspace, and run a real pixi scene graph through it.
      # Builds dist as its first stage.
      - name: Verify the published package
        if: steps.cs.outputs.count != '0'
        run: node tools/verify-package.mjs

      # Commit locally; the push waits until npm has accepted the publish.
      # In prerelease mode an already-consumed changeset's `.md` is retained, so
      # the count above can be non-zero while `changeset version` is a no-op.
      # Only commit when something actually changed, so publish stays idempotent.
      - name: Commit version bump
        if: steps.cs.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit; skipping."
          else
            git commit -m "chore: release [skip ci]"
          fi

      # c. Publish. Idempotent: changesets skips versions already on the
      #    registry. `set -o pipefail` is required, or the pipeline reports
      #    tee's exit code and a rejected publish goes green having shipped
      #    nothing.
      - name: Publish to npm
        if: steps.cs.outputs.count != '0'
        run: |
          set -o pipefail
          pnpm changeset publish | tee publish.log
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # changesets only tags packages it published in THIS run. A re-run after
      # a publish whose push failed finds the version already on npm, publishes
      # nothing, and would leave the tag missing. Recreate any missing tag for
      # the current public package versions, annotated, as changesets makes
      # them; never force an existing tag.
      - name: Ensure git tags
        if: steps.cs.outputs.count != '0'
        run: |
          specs=$(pnpm ls -r --depth -1 --json \
            | node -e 'for (const p of JSON.parse(require("fs").readFileSync(0, "utf8"))) if (!p.private) console.log(`${p.name}@${p.version}`)')
          while read -r spec; do
            [ -z "$spec" ] && continue
            if git rev-parse -q --verify "refs/tags/$spec" >/dev/null; then
              echo "tag $spec already exists locally"
            elif git ls-remote --tags origin "refs/tags/$spec" | grep -q "$spec"; then
              echo "tag $spec already exists on the remote"
            else
              git tag "$spec" -m "$spec"
              echo "tagged $spec"
            fi
          done <<< "$specs"

      # d. Persist the bump now that npm has accepted it.
      - name: Push commit and tags
        if: steps.cs.outputs.count != '0'
        run: git push --follow-tags origin HEAD:main

      # e. Insurance on the prerelease dist-tag. changesets publishes a
      #    prerelease to the pre tag (`next`) whenever the package has ever had
      #    a regular release, and only falls back to `latest` when every
      #    published version is itself a prerelease of that tag (its
      #    "only-pre" rule). solid-pixi has stable releases, so `next` advances
      #    on its own and `latest` stays put. `npm dist-tag add` is idempotent,
      #    so re-asserting the tag every run costs nothing and repairs a drift
      #    (a deleted tag, a manual publish) that changesets would not notice.
      #    Deliberately not `|| true`: the tag write is the point of the step.
      - name: Sync the prerelease dist-tag
        if: steps.cs.outputs.count != '0'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # `changeset pre exit` removes pre.json. After that `latest` is the
          # real channel and there is no prerelease tag to maintain.
          if [ ! -f .changeset/pre.json ]; then
            echo "Not in prerelease mode; nothing to re-tag."
            exit 0
          fi
          tag=$(node -p "require('./.changeset/pre.json').tag")
          # Collect first, then loop. A `while` on the right of a pipe runs in a
          # subshell, so a failure flag set inside it would be discarded and the
          # step would pass having tagged nothing.
          specs=$(pnpm ls -r --depth -1 --json \
            | node -e 'for (const p of JSON.parse(require("fs").readFileSync(0, "utf8"))) if (!p.private) console.log(`${p.name}@${p.version}`)')
          failed=0
          while read -r spec; do
            [ -z "$spec" ] && continue
            npm dist-tag add "$spec" "$tag" || failed=1
          done <<< "$specs"
          exit $failed

      # f. One GitHub Release per tag on the bump commit, notes taken from the
      #    CHANGELOG. Driven by the tags that actually exist, not by publish
      #    output, so a re-run after a partial failure recovers missing
      #    releases. `gh release view` guards the already-exists case; any
      #    other failure fails the job instead of being echoed away.
      - name: Create GitHub Releases
        if: steps.cs.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(git tag --points-at HEAD)
          if [ -z "$tags" ]; then
            echo "No tags on the release commit; nothing to release."
            exit 0
          fi
          failed=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release $tag already exists, skipping"
              continue
            fi
            name="${tag%@*}"
            ver="${tag##*@}"
            pj=$(grep -rl "\"name\": \"$name\"" --include=package.json packages | head -1)
            dir=$(dirname "$pj")
            notes="$tag"
            if [ -f "$dir/CHANGELOG.md" ]; then
              block=$(awk -v v="## $ver" '$0==v{f=1;next} /^## /{f=0} f' "$dir/CHANGELOG.md")
              [ -n "$block" ] && notes="$block"
            fi
            pre=""
            case "$ver" in *-*) pre="--prerelease" ;; esac
            echo "Creating release $tag $pre"
            gh release create "$tag" $pre --title "$tag" --notes "$notes" || failed=1
          done <<< "$tags"
          exit $failed
